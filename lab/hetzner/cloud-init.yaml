#cloud-config
# Prepares an Ubuntu 24.04 node for kubeadm. Does NOT run kubeadm init/join:
# that is the exercise (issue #2).
# __K8S_MINOR__ is replaced by lab.sh (e.g. 1.36), one minor behind the latest
# release so that issue #6 (upgrade one minor version) has somewhere to go.

package_update: true
packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gpg
  - containerd

write_files:
  - path: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter
  - path: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables  = 1
      net.bridge.bridge-nf-call-ip6tables = 1
      net.ipv4.ip_forward                 = 1

runcmd:
  # Swap off (Hetzner images have none, but be explicit).
  - swapoff -a
  - sed -i '/\sswap\s/ s/^/#/' /etc/fstab

  # Kernel modules and sysctls for pod networking.
  - modprobe overlay
  - modprobe br_netfilter
  - sysctl --system

  # containerd with the systemd cgroup driver (what kubelet expects).
  - mkdir -p /etc/containerd
  - containerd config default > /etc/containerd/config.toml
  - sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
  - systemctl restart containerd
  - systemctl enable containerd

  # kubeadm, kubelet, kubectl from the official repo, pinned.
  - mkdir -p /etc/apt/keyrings
  - curl -fsSL https://pkgs.k8s.io/core:/stable:/v__K8S_MINOR__/deb/Release.key | gpg --dearmor -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg
  - echo 'deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.gpg] https://pkgs.k8s.io/core:/stable:/v__K8S_MINOR__/deb/ /' > /etc/apt/sources.list.d/kubernetes.list
  - apt-get update
  - apt-get install -y kubelet kubeadm kubectl
  - apt-mark hold kubelet kubeadm kubectl

  # kubelet must use the private network address, not the public one.
  - |
    for i in $(seq 1 60); do
      PRIV=$(ip -4 -o addr show | awk '$4 ~ /^10\.0\./ {split($4,a,"/"); print a[1]; exit}')
      [ -n "$PRIV" ] && break
      sleep 2
    done
    echo "KUBELET_EXTRA_ARGS=--node-ip=$PRIV" > /etc/default/kubelet
    systemctl enable kubelet

  - touch /root/NODE_READY
